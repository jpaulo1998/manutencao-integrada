<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

  <meta name="theme-color" content="#2176c7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Manutenção Integrada">

  <title>Login — Manutenção Integrada</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0d2b4e, #1a4f8a);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 460px;
    }

    .btn-voltar {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .btn-voltar:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      text-align: right;
    }

    .logo i {
      color: #f0c040;
    }

    .box {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .box-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .box-header i {
      font-size: 52px;
      color: #1a4f8a;
      display: block;
      margin-bottom: 12px;
    }

    .box-header h2 {
      font-size: 22px;
      color: #0d2b4e;
      margin-bottom: 6px;
    }

    .box-header p {
      font-size: 14px;
      color: #555;
    }

    .grupo {
      margin-bottom: 20px;
    }

    .grupo label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #0d2b4e;
      margin-bottom: 8px;
    }

    .grupo input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #d0dce8;
      border-radius: 10px;
      font-size: 15px;
      color: #0d2b4e;
      background: #f0f4f8;
      outline: none;
      transition: border-color 0.2s;
    }

    .grupo input:focus {
      border-color: #2176c7;
    }

    .senha-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .senha-wrapper input {
      padding-right: 48px;
    }

    .btn-olho {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: #555;
      font-size: 16px;
      padding: 4px;
    }

    .btn-olho:hover {
      color: #2176c7;
    }

    .erro {
      display: none;
      align-items: center;
      gap: 8px;
      background: #fdecea;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 10px 14px;
      color: #c0392b;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .btn-entrar {
      width: 100%;
      padding: 14px;
      background: #2176c7;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-entrar:hover {
      background: #1a5fa3;
    }

    .btn-entrar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    footer {
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .box {
        padding: 28px 22px;
      }

      .header {
        align-items: flex-start;
      }

      .logo {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <a href="index.html" class="btn-voltar">
      <i class="fa-solid fa-arrow-left"></i>
      Voltar
    </a>

    <div class="logo">
      <i class="fa-solid fa-screwdriver-wrench"></i>
      <span>Manutenção Integrada</span>
    </div>

    <span></span>
  </div>

  <div class="box">
    <div class="box-header">
      <i class="fa-solid fa-user-shield"></i>

      <h2>Acesso Administrativo</h2>

      <p>Digite suas credenciais para continuar</p>
    </div>

    <form id="form-login">

      <div class="grupo">
        <label for="input-usuario">
          <i class="fa-solid fa-envelope"></i>
          E-mail
        </label>

        <input
          type="email"
          id="input-usuario"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >
      </div>

      <div class="grupo">
        <label for="input-senha">
          <i class="fa-solid fa-lock"></i>
          Senha
        </label>

        <div class="senha-wrapper">
          <input
            type="password"
            id="input-senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="btn-olho"
            onclick="toggleSenha()"
            aria-label="Mostrar ou ocultar senha"
          >
            <i class="fa-solid fa-eye" id="icone-olho"></i>
          </button>
        </div>
      </div>

      <div class="erro" id="msg-erro">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="texto-erro">Usuário ou senha incorretos.</span>
      </div>

      <button type="submit" class="btn-entrar" id="btn-entrar">
        <i class="fa-solid fa-right-to-bracket"></i>
        Entrar
      </button>

    </form>
  </div>

  <footer>
    <p>
      &copy; 2026 Manutenção Integrada — Todos os direitos reservados
    </p>
  </footer>

  <script type="module">
    import {
      signInWithEmailAndPassword,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    import {
      doc,
      getDoc,
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    import { auth, db } from "./js/firebase-config.js";

    const msgErro = document.getElementById("msg-erro");
    const txtErro = document.getElementById("texto-erro");
    const botao = document.getElementById("btn-entrar");

    function mostrarErro(texto) {
      txtErro.textContent = texto;
      msgErro.style.display = "flex";
    }

    function mensagemErro(codigo) {
      const mensagens = {
        "auth/invalid-email": "Digite um e-mail válido.",
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/user-not-found": "E-mail ou senha incorretos.",
        "auth/wrong-password": "E-mail ou senha incorretos.",
        "auth/too-many-requests":
          "Muitas tentativas. Aguarde alguns minutos e tente de novo.",
        "auth/network-request-failed": "Sem conexão com a internet.",
      };
      return mensagens[codigo] || "Não foi possível entrar.";
    }

    // O acesso de administrador é dado pelo documento admins/{uid}
    // com o campo ativo = true (criado no console do Firebase).
    async function ehAdmin(usuario) {
      const documento = await getDoc(doc(db, "admins", usuario.uid));
      return documento.exists() && documento.data().ativo === true;
    }

    document
      .getElementById("form-login")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        msgErro.style.display = "none";

        const email = document
          .getElementById("input-usuario")
          .value.trim()
          .toLowerCase();
        const senha = document.getElementById("input-senha").value;

        botao.disabled = true;

        try {
          const resultado = await signInWithEmailAndPassword(auth, email, senha);

          if (await ehAdmin(resultado.user)) {
            window.location.href = "admin.html";
            return;
          }

          await signOut(auth);
          mostrarErro("Este usuário não tem acesso administrativo.");
        } catch (erro) {
          console.error("Erro no login:", erro);
          mostrarErro(mensagemErro(erro.code));
        } finally {
          botao.disabled = false;
        }

        document.getElementById("input-senha").value = "";
        document.getElementById("input-senha").focus();
      });

    window.toggleSenha = function () {
      const input = document.getElementById("input-senha");
      const icone = document.getElementById("icone-olho");

      if (input.type === "password") {
        input.type = "text";
        icone.className = "fa-solid fa-eye-slash";
      } else {
        input.type = "password";
        icone.className = "fa-solid fa-eye";
      }
    };
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register("./service-worker.js")
          .then(function (reg) {
            console.log('Service Worker registrado!', reg);
          })
          .catch(function (err) {
            console.error(
              'Erro ao registrar o Service Worker:',
              err
            );
          });
      });
    }
  </script>

</body>
</html>
